{% extends "layout.html" %}
{% block title %}Modifier Affectation{% endblock %}

{% block content %}
<div class="max-w-md mx-auto p-6 bg-white rounded shadow">
    <h1 class="text-2xl font-bold mb-4">Modifier Affectation</h1>

    <form method="POST">
        <!-- Matière (non modifiable) -->
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-1">Matière</label>
            <input type="text" value="{{ affect.matiere.titre }}" class="w-full px-3 py-2 border rounded bg-gray-100" disabled>
        </div>

        <!-- Année / Semestre (non modifiable) -->
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-1">Année / Semestre</label>
            <input type="text" value="{{ affect.matiere.annee_formation.libelle }} / {{ affect.matiere.semestre.libelle }}" class="w-full px-3 py-2 border rounded bg-gray-100" disabled>
        </div>

        <!-- Choix de l'enseignant -->
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-1">Enseignant</label>
            <select name="enseignant_id" class="w-full px-3 py-2 border rounded">
                <option value="">-- Choisir un enseignant --</option>
                {% for e in enseignants %}
                    <option value="{{ e.id }}" {% if affect.enseignant_id == e.id %}selected{% endif %}>
                        {{ e.utilisateur.nom_complet }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Bouton -->
        <div class="flex justify-between items-center">
            <a href="{{ url_for('chef_filiere.assignations_filter', filiere_id=affect.matiere.semestre.annee.filiere.id) }}" class="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">Annuler</a>
            <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">Enregistrer</button>
        </div>
    </form>
</div>
{% endblock %}
