{% extends "layout.html" %}
{% block title %}Mot de passe oublié{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="w-full max-w-md bg-white p-8 rounded-lg shadow">
    <h2 class="text-2xl font-bold mb-6 text-center">Mot de passe oublié</h2>
    <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="space-y-4">
      <input type="email" name="email" placeholder="Email" required
             class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button type="submit"
              class="w-full bg-yellow-500 text-white py-2 rounded-lg hover:bg-yellow-600 transition">
        Envoyer le lien de réinitialisation
      </button>
    </form>
    <p class="mt-4 text-sm text-center">
      <a href="{{ url_for('auth.login') }}" class="text-blue-500 hover:underline">Retour à la connexion</a>
    </p>
  </div>
</div>
{% endblock %}
