{% extends "layout.html" %}
{% block title %}Inscription{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="w-full max-w-md bg-white p-8 rounded-lg shadow">
    <h2 class="text-2xl font-bold mb-6 text-center">Créer un compte</h2>
    <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-4">
      <input type="text" name="nom_complet" placeholder="Nom complet" required
             class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <input type="email" name="email" placeholder="Email" required
             class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <input type="password" name="mot_de_passe" placeholder="Mot de passe" required
             class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button type="submit"
              class="w-full bg-green-500 text-white py-2 rounded-lg hover:bg-green-600 transition">S’inscrire</button>
    </form>
    <p class="mt-4 text-sm text-center">
      <a href="{{ url_for('auth.login') }}" class="text-blue-500 hover:underline">Déjà un compte ? Se connecter</a>
    </p>
  </div>
</div>
{% endblock %}
