{% extends 'layout.html' %}

{% block title %}Ajouter Année{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto p-6">

  <!-- Titre -->
  <h1 class="text-3xl font-bold mb-6 text-blue-700">➕ Ajouter Année pour {{ filiere.nom }}</h1>
  <p class="mb-6 text-gray-600">Remplissez les informations pour créer une nouvelle année de formation.</p>

  <!-- Formulaire -->
  <form method="POST" class="bg-white p-6 rounded-xl shadow-md w-full">
    
    <!-- Libellé -->
    <div class="mb-4">
        <label class="block mb-2 font-semibold text-gray-700">Libellé</label>
        <input type="text" name="libelle"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
               placeholder="Ex : 1ère année" required>
    </div>

    <!-- Ordre -->
    <div class="mb-4">
        <label class="block mb-2 font-semibold text-gray-700">Ordre</label>
        <input type="number" name="ordre"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
               placeholder="Ex : 1" required>
    </div>

    <!-- Bouton -->
    <button type="submit"
            class="bg-blue-500 text-white px-5 py-2 rounded-lg hover:bg-blue-600 font-semibold transition-colors duration-200">
        Ajouter
    </button>

  </form>
</div>
{% endblock %}
