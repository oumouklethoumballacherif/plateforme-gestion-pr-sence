{% extends "layout.html" %}

{% block title %}Modifier Enseignant{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow">
    <h2 class="text-2xl font-bold mb-4 text-blue-600">Modifier Enseignant</h2>

    <form method="POST">
        <label class="block font-semibold mt-3">Nom complet</label>
        <input type="text" name="nom_complet" value="{{ user.nom_complet }}"
               class="w-full p-2 border rounded">

        <label class="block font-semibold mt-3">Email</label>
        <input type="email" name="email" value="{{ user.email }}"
               class="w-full p-2 border rounded">

        <label class="block font-semibold mt-3">Département</label>
        <select name="departement_id" class="w-full p-2 border rounded">
            {% for dep in departements %}
                <option value="{{ dep.id }}" {% if dep.id == enseignant.departement_id %}selected{% endif %}>
                    {{ dep.nom }}
                </option>
            {% endfor %}
        </select>

        <div class="flex justify-between mt-6">
            <a href="{{ url_for('admin.manage_teachers') }}"
               class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">
                Annuler
            </a>

            <button type="submit"
                    class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                Sauvegarder
            </button>
        </div>
    </form>
</div>
{% endblock %}
