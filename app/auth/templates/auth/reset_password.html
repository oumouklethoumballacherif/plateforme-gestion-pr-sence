{% extends "layout.html" %}
{% block title %}Réinitialiser le mot de passe{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="w-full max-w-md bg-white p-8 rounded-lg shadow">
    <h2 class="text-2xl font-bold mb-6 text-center">Réinitialiser le mot de passe</h2>
    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="space-y-4">
      <input type="password" name="mot_de_passe" placeholder="Nouveau mot de passe" required
             class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <input type="password" name="mot_de_passe_confirm" placeholder="Confirmer mot de passe" required
             class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button type="submit"
              class="w-full bg-green-500 text-white py-2 rounded-lg hover:bg-green-600 transition">
        Réinitialiser
      </button>
    </form>
    <p class="mt-4 text-sm text-center">
      <a href="{{ url_for('auth.login') }}" class="text-blue-500 hover:underline">Retour à la connexion</a>
    </p>
  </div>
</div>
{% endblock %}
