{% extends "layout.html" %}
{% block title %}Modifier Affectation{% endblock %}

{% block content %}
<div class="max-w-md mx-auto p-6 bg-white rounded-xl shadow-md mt-8">

    <!-- Titre -->
    <h1 class="text-3xl font-bold mb-6 text-green-700">✏️ Modifier Affectation</h1>
    <p class="mb-6 text-gray-600">Mettez à jour l'enseignant pour cette matière.</p>

    <!-- Formulaire -->
    <form method="POST">

        <!-- Matière (non modifiable) -->
        <div class="mb-4">
            <label class="block mb-2 font-semibold text-gray-700">Matière</label>
            <input type="text" value="{{ affect.matiere.titre }}" 
                   class="w-full px-3 py-2 border rounded-lg bg-gray-100" disabled>
        </div>

        <!-- Année / Semestre (non modifiable) -->
        <div class="mb-4">
            <label class="block mb-2 font-semibold text-gray-700">Année / Semestre</label>
            <input type="text" value="{{ affect.matiere.annee_formation.libelle }} / {{ affect.matiere.semestre.libelle }}" 
                   class="w-full px-3 py-2 border rounded-lg bg-gray-100" disabled>
        </div>

        <!-- Choix de l'enseignant -->
        <div class="mb-6">
            <label class="block mb-2 font-semibold text-gray-700">Enseignant</label>
            <select name="enseignant_id" 
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
                <option value="">-- Choisir un enseignant --</option>
                {% for e in enseignants %}
                    <option value="{{ e.id }}" {% if affect.enseignant_id == e.id %}selected{% endif %}>
                        {{ e.utilisateur.nom_complet }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Boutons -->
        <div class="flex justify-between items-center">
            <a href="{{ url_for('chef_filiere.assignations_filter', filiere_id=affect.matiere.semestre.annee.filiere.id) }}" 
               class="px-4 py-2 bg-gray-400 text-white rounded-lg hover:bg-gray-500 transition-colors duration-200">
               Annuler
            </a>
            <button type="submit" 
                    class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors duration-200">
                Enregistrer
            </button
