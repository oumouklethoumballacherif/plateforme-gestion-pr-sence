{% extends "layout.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-10 p-6 bg-white rounded shadow">
  <h2 class="text-xl font-bold mb-4">Créer votre mot de passe</h2>
  <form method="POST">
    <div class="mb-4">
      <label class="block mb-1 text-gray-700">Adresse email</label>
      <input type="email" value="{{ email }}" disabled class="w-full p-2 border rounded bg-gray-100">
    </div>
    <div class="mb-4">
      <label class="block mb-1 text-gray-700">Nouveau mot de passe</label>
      <input type="password" name="password" required class="w-full p-2 border rounded">
    </div>
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Enregistrer</button>
  </form>
</div>
{% endblock %}
