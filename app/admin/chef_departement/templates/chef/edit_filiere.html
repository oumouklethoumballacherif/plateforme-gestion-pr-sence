{% extends "layout.html" %}
{% block content %}
<div class="max-w-3xl mx-auto bg-white shadow-xl rounded-2xl p-6 mt-10 border border-gray-200">
  <h2 class="text-2xl font-bold text-[#003DA5] mb-6 relative
             after:block after:w-16 after:h-1 after:bg-[#003DA5] after:rounded-full after:mt-1">
    ✏️ Modifier la filière
  </h2>

  <form method="POST" class="space-y-6">
    <div>
      <label class="block text-gray-600 mb-1">Département :</label>
      <input type="text"
             value="{{ filiere.departement.nom }}"
             readonly
             class="w-full border border-gray-300 bg-gray-100 rounded-lg p-2">
    </div>

    <div>
      <label for="nom" class="block text-gray-600 mb-1">Nom de la filière :</label>
      <input type="text" id="nom" name="nom" value="{{ filiere.nom }}" required
             class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-[#003DA5]">
    </div>

    <div>
      <label for="code" class="block text-gray-600 mb-1">Code :</label>
      <input type="text" id="code" name="code" value="{{ filiere.code }}"
             class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-[#003DA5]">
    </div>

    <div class="flex justify-end space-x-4">
      <a href="{{ url_for('chef.manage_filieres') }}"
         class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 rounded-lg transition shadow-sm">
        Annuler
      </a>
      <button type="submit"
              class="px-4 py-2 bg-[#003DA5] hover:bg-[#002F7A] text-white rounded-lg shadow transition">
        💾 Enregistrer
      </button>
    </div>
  </form>
</div>
{% endblock %}
