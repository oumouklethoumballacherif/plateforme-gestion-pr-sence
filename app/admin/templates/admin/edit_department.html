{% extends 'layout.html' %}
{% block title %}Modifier Département{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold text-gray-800 mb-8">Modifier le département</h1>

<form method="POST">
    <div class="bg-white shadow-xl p-6 rounded-2xl border border-gray-200 max-w-lg mx-auto">
        <!-- Nom -->
        <div class="mb-5">
            <label class="block mb-2 font-semibold text-[#003DA5]">Nom</label>
            <input type="text" name="nom" value="{{ departement.nom }}" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#003DA5] focus:border-[#003DA5] transition">
        </div>

        <!-- Code -->
        <div class="mb-5">
            <label class="block mb-2 font-semibold text-[#003DA5]">Code</label>
            <input type="text" name="code" value="{{ departement.code }}"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#003DA5] focus:border-[#003DA5] transition">
        </div>

        <!-- Boutons -->
        <div class="flex space-x-4">
            <!-- Enregistrer → bleu UIR -->
            <button type="submit"
                    class="flex-1 bg-[#003DA5] text-white px-6 py-2 rounded-lg font-semibold hover:bg-[#002F7A] shadow-md transition">
                Enregistrer
            </button>

            <!-- Annuler → gris clair -->
            <a href="{{ url_for('admin.manage_departments') }}"
               class="flex-1 bg-[#FFD500] text-gray-800 px-6 py-2 rounded-lg hover:bg-[#FFC700] shadow-md text-center transition">
               Annuler
            </a>
        </div>
    </div>
</form>
{% endblock %}
