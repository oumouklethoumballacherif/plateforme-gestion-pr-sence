{% extends 'layout.html' %}

{% block title %}Ajouter Année{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-6">Ajouter Année pour {{ filiere.nom }}</h1>

<form method="POST" class="bg-white p-6 rounded shadow-md w-full md:w-1/2">
    <div class="mb-4">
        <label class="block mb-1">Libellé</label>
        <input type="text" name="libelle" class="w-full border rounded px-3 py-2" required>
    </div>
    <div class="mb-4">
        <label class="block mb-1">Ordre</label>
        <input type="number" name="ordre" class="w-full border rounded px-3 py-2" required>
    </div>
    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Ajouter</button>
</form>
{% endblock %}
