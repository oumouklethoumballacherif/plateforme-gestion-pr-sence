{% extends "layout.html" %}
{% block title %}Réinitialiser le mot de passe{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12">

  <div class="w-full max-w-md bg-white p-10 rounded-2xl shadow-xl border border-gray-200">

    <!-- Titre -->
    <h2 class="text-4xl font-extrabold text-center text-[#003DA5] mb-2 tracking-tight">
      Réinitialiser le mot de passe
    </h2>

    <!-- Barre décorative UIR (bleu + jaune + vert) -->
    <div class="flex justify-center gap-2 mb-8">
      <span class="w-10 h-1 rounded-full bg-[#003DA5]"></span>
      <span class="w-6 h-1 rounded-full bg-[#F2A900]"></span>
      <span class="w-4 h-1 rounded-full bg-[#3BAE5D]"></span>
    </div>

    <!-- Formulaire -->
    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="space-y-6">

      <!-- Nouveau mot de passe -->
      <div>
        <label class="text-sm font-semibold text-gray-700">Nouveau mot de passe</label>
        <input type="password" name="mot_de_passe" required
               class="w-full mt-1 px-4 py-3 border border-gray-300 rounded-lg 
                      focus:outline-none focus:ring-2 focus:ring-[#003DA5] 
                      focus:border-[#003DA5] transition"
               placeholder="•••••••••••">
      </div>

      <!-- Confirmer mot de passe -->
      <div>
        <label class="text-sm font-semibold text-gray-700">Confirmer mot de passe</label>
        <input type="password" name="mot_de_passe_confirm" required
               class="w-full mt-1 px-4 py-3 border border-gray-300 rounded-lg 
                      focus:outline-none focus:ring-2 focus:ring-[#003DA5] 
                      focus:border-[#003DA5] transition"
               placeholder="•••••••••••">
      </div>

      <!-- Bouton -->
      <button type="submit"
              class="w-full bg-[#003DA5] text-white py-3.5 rounded-lg text-lg font-semibold 
                     hover:bg-[#002F7A] transition shadow-sm hover:shadow-md">
        Réinitialiser
      </button>

    </form>

    <!-- Lien vers Connexion -->
    <p class="mt-7 text-sm text-center text-gray-700">
      <a href="{{ url_for('auth.login') }}" 
         class="text-[#003DA5] font-semibold hover:underline hover:text-[#002F7A]">
        Retour à la connexion
      </a>
    </p>

  </div>

</div>
{% endblock %}
