{% extends "layout.html" %}
{% block title %}Créer votre mot de passe{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12">

  <div class="w-full max-w-md bg-white p-10 rounded-2xl shadow-xl border border-gray-200">

    <!-- Titre -->
    <h2 class="text-3xl font-extrabold text-center text-[#003DA5] mb-3 tracking-tight">
      Créer votre mot de passe
    </h2>

    <!-- Barre décorative UIR (bleu + jaune + vert) -->
    <div class="flex justify-center gap-2 mb-8">
      <span class="w-10 h-1 rounded-full bg-[#003DA5]"></span>
      <span class="w-6 h-1 rounded-full bg-[#F2A900]"></span>
      <span class="w-4 h-1 rounded-full bg-[#3BAE5D]"></span>
    </div>

    <!-- Formulaire -->
    <form method="POST" class="space-y-6">

      <!-- Email -->
      <div>
        <label class="text-sm font-semibold text-gray-700">Adresse email</label>
        <input type="email" value="{{ email }}" disabled
               class="w-full mt-1 px-4 py-3 border border-gray-300 rounded-lg bg-gray-100 cursor-not-allowed">
      </div>

      <!-- Nouveau mot de passe -->
      <div>
        <label class="text-sm font-semibold text-gray-700">Nouveau mot de passe</label>
        <input type="password" name="password" required
               class="w-full mt-1 px-4 py-3 border border-gray-300 rounded-lg 
                      focus:outline-none focus:ring-2 focus:ring-[#003DA5] 
                      focus:border-[#003DA5] transition"
               placeholder="•••••••••••">
      </div>

      <!-- Bouton -->
      <button type="submit"
              class="w-full bg-[#003DA5] text-white py-3.5 rounded-lg text-lg font-semibold 
                     hover:bg-[#002F7A] transition shadow-sm hover:shadow-md">
        Enregistrer
      </button>

    </form>

  </div>

</div>
{% endblock %}
