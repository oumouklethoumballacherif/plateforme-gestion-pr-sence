{% extends "layout.html" %}

{% block title %}Modifier Enseignant{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-xl border border-gray-200 mt-8">
    <h2 class="text-2xl font-bold mb-6 text-[#003DA5] relative
               after:block after:w-16 after:h-1 after:bg-[#003DA5] after:rounded-full after:mt-1">
        Modifier Enseignant
    </h2>

    <form method="POST" class="space-y-5">
        <!-- Nom complet -->
        <div>
            <label class="block font-semibold mb-1 text-gray-700">Nom complet</label>
            <input type="text" name="nom_complet" value="{{ user.nom_complet }}"
                   class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#003DA5] focus:outline-none transition">
        </div>

        <!-- Email -->
        <div>
            <label class="block font-semibold mb-1 text-gray-700">Email</label>
            <input type="email" name="email" value="{{ user.email }}"
                   class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#003DA5] focus:outline-none transition">
        </div>

        <!-- Département -->
        <div>
            <label class="block font-semibold mb-1 text-gray-700">Département</label>
            <select name="departement_id"
                    class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#003DA5] focus:outline-none transition">
                {% for dep in departements %}
                    <option value="{{ dep.id }}" {% if dep.id == enseignant.departement_id %}selected{% endif %}>
                        {{ dep.nom }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Actions -->
        <div class="flex space-x-4 mt-6">
            <!-- Annuler → jaune UIR -->
            <a href="{{ url_for('admin.manage_teachers') }}"
               class="flex-1 px-4 py-2 bg-[#FFD500] text-gray-800 rounded-lg hover:bg-[#FFC700] shadow-md text-center transition">
                Annuler
            </a>

            <!-- Sauvegarder → bleu UIR -->
            <button type="submit"
                    class="flex-1 px-4 py-2 bg-[#003DA5] text-white rounded-lg hover:bg-[#002F7A] shadow-md transition">
                Sauvegarder
            </button>
        </div>
    </form>
</div>
{% endblock %}
