{% extends "layout.html" %}
{% block title %}Modifier le cours{% endblock %}

{% block content %}
<div class="p-6">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">✏️ Modifier le cours</h1>

  {% if seance %}
  <form method="POST" class="bg-white shadow-md rounded-lg p-6">
    <div class="mb-4">
      <label for="date_prevue" class="block text-gray-600 mb-1">Date et heure :</label>
      <input type="datetime-local" name="date_prevue" id="date_prevue"
             value="{{ seance.date_prevue.strftime('%Y-%m-%dT%H:%M') }}"
             class="w-full border rounded p-2" required>
    </div>

    <div class="mb-4">
      <label for="duree_minutes" class="block text-gray-600 mb-1">Durée (minutes) :</label>
      <input type="number" name="duree_minutes" id="duree_minutes"
             value="{{ seance.duree_minutes }}"
             class="w-full border rounded p-2" required>
    </div>

    <div class="text-right">
      <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded shadow">
        💾 Enregistrer
      </button>
      <a href="{{ url_for('chef.manage_cours') }}"
         class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded shadow ml-2">
        🔙 Annuler
      </a>
    </div>
  </form>
  {% else %}
    <p class="text-red-500 text-center py-6">Cours introuvable.</p>
  {% endif %}
</div>
{% endblock %}
