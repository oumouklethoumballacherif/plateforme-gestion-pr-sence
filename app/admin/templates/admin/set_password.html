{% extends "layout.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-10 p-6 bg-white shadow-xl rounded-2xl border border-gray-200">
  <h2 class="text-2xl font-bold mb-6 text-[#003DA5] text-center relative
             after:block after:w-16 after:h-1 after:bg-[#003DA5] after:rounded-full after:mt-2">
    Créer votre mot de passe
  </h2>
  <form method="POST" class="space-y-4">
    <input type="hidden" name="email" value="{{ email }}">
    <div>
      <label class="block text-gray-700 font-semibold mb-1">Nouveau mot de passe</label>
      <input type="password" name="mot_de_passe"
             class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-[#003DA5] focus:outline-none"
             required>
    </div>
    <button type="submit"
            class="w-full bg-[#003DA5] hover:bg-[#002F7A] text-white px-4 py-2 rounded-lg font-semibold shadow-md transition">
      Enregistrer
    </button>
  </form>
</div>
{% endblock %}
