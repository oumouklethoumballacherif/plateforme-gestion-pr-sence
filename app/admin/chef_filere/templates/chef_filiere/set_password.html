{% extends "layout.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-10 p-6 bg-white shadow-lg rounded-lg">
  <h2 class="text-xl font-bold mb-4 text-center">Créer votre mot de passe</h2>
  <form method="POST">
    <input type="hidden" name="email" value="{{ email }}">
    <div class="mb-4">
      <label class="block text-gray-700">Nouveau mot de passe</label>
      <input type="password" name="mot_de_passe" class="w-full border p-2 rounded" required>
    </div>
    <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">
      Enregistrer
    </button>
  </form>
</div>
{% endblock %}
