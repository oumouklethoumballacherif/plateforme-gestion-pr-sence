{% extends "layout.html" %}
{% block title %}Modifier séance{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto p-6">

  <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">✏️ Modifier la séance</h1>

  <form method="POST" class="bg-white shadow-md rounded-xl p-6 grid grid-cols-1 gap-4">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <!-- Type de séance -->
      <div>
        <label class="block mb-1 font-medium text-gray-700">Type de séance</label>
        <select name="type_seance" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400" required>
          <option value="CM" {% if seance.type_seance=="CM" %}selected{% endif %}>CM</option>
          <option value="TD" {% if seance.type_seance=="TD" %}selected{% endif %}>TD</option>
          <option value="TP" {% if seance.type_seance=="TP" %}selected{% endif %}>TP</option>
        </select>
      </div>

      <!-- Date et heure -->
      <div>
        <label class="block mb-1 font-medium text-gray-700">Date et heure</label>
        <input type="datetime-local" name="date_prevue"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400"
               value="{{ seance.date_prevue.strftime('%Y-%m-%dT%H:%M') }}" required>
      </div>

      <!-- Durée -->
      <div>
        <label class="block mb-1 font-medium text-gray-700">Durée (minutes)</label>
        <input type="number" name="duree_minutes" step="1"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400"
               value="{{ seance.duree_minutes }}" required>
      </div>

    </div>

    <div class="text-right mt-6">
      <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg">
        💾 Enregistrer les modifications
      </button>
    </div>

  </form>

</div>
{% endblock %}
